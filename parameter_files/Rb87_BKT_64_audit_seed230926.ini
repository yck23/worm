# Independent 23-24 September 2026 audit family.
# Homogeneous lattice discretisation of the Beregi thesis 2D Rb-87 regime.
# Mapping assumptions: a_grid = 0.5 um, g_tilde = 0.076, t_hop = 1.
# At T = 40 nK: T/t = 3.58323844537 and beta*t = 0.279077157506.
# Exact-N canonical approximation to the homogeneous continuum regime.
# This is a lattice mapping, not a simulation of the thesis trap or bilayer.
model = BoseHubbard
runtimelimit = 900
sweeps = 4800000
thermalization = 50000
Lx = 64
Ly = 64
Lz = 1
pbcx = 1
pbcy = 1
pbcz = 0
t_hop = 1.0
U_on = 0.152
V_nn = 0.0
mu = -3.47
beta = 0.279077157505874
nmax = 16
E_off = 1.0
canonical = 9948
canonical_window = 0.5
initial_occupancy = 2
seed = 230926
Ntest = 1000000
Nsave = 100000000
Nmeasure = 1
Nmeasure2 = 10000
C_worm = 2.0
p_insertworm = 1.0
p_moveworm = 0.4
p_insertkink = 0.3
p_deletekink = 0.2
p_glueworm = 0.1
outputfile = Rb87_BKT_64.out.h5
checkpoint = Rb87_BKT_64.clone.h5
