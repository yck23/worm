# Square-lattice speckle example. Generate results/speckle.dat first; see
# docs/programmable_potentials.md. Lengths and energies are numerical units.
model = "BoseHubbard"
runtimelimit = 60
sweeps = 10000
thermalization = 1000
Lx = 32
Ly = 32
Lz = 1
pbcx = 1
pbcy = 1
pbcz = 0
t_hop = 1.0
U_on = 4.0
V_nn = 0.0
mu = 0.7
# Set to 0 to ignore the map and use zero added site potential.
onsite_potential_enabled = 1
onsite_potential_file = "results/speckle.dat"
beta = 1.0
nmax = 8
E_off = 1.0
canonical = -1
initial_occupancy = 1
seed = 20261019
Ntest = 10000
Nsave = 100000000
Nmeasure = 1
Nmeasure2 = 10
C_worm = 2.0
p_insertworm = 1.0
p_moveworm = 0.4
p_insertkink = 0.3
p_deletekink = 0.2
p_glueworm = 0.1
outputfile = "speckle.out.h5"
checkpoint = "speckle.clone.h5"
