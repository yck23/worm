# Grand-canonical version of the homogeneous 64 x 64 Rb-87 lattice mapping.
# The thermodynamic controls are mu and beta. Particle number is measured,
# not fixed. The numerical value of mu below was independently tested at L=16,
# L=24, and L=32; it defines a fixed-mu path and does not force a chosen density.
model = "BoseHubbard"
runtimelimit = 900
sweeps = 4800000
# This is only a technical accumulator threshold. Discard complete Fresh and
# Resume invocations as burn-in, as explained in GRAND_CANONICAL_RUN_GUIDE.md.
thermalization = 1000
Lx = 64
Ly = 64
Lz = 1
pbcx = 1
pbcy = 1
pbcz = 0
t_hop = 1.0
U_on = 0.152
V_nn = 0.0
# This is now the density-control parameter. At fixed beta, changing mu changes
# the equilibrium particle-number distribution and therefore the mean density.
mu = -3.53
beta = 0.279077157505874
nmax = 16
E_off = 1.0
# -1 selects grand-canonical sampling in the ordinary (non-CWINDOW) executable.
canonical = -1
# Parsed but unused by the ordinary grand-canonical executable.
canonical_window = 0.5
# Starting guess only: this initializes near the expected density but does not
# constrain N after startup. Equilibrium results must be independent of it.
initial_particle_number = 9948
# Fallback used only when initial_particle_number = -1.
initial_occupancy = 2
seed = 96040
Ntest = 1000000
Nsave = 100000000
Nmeasure = 1
# Keeping this below the sweeps completed by every MPI rank avoids a partial-
# observable merge error. It is not enough for precision correlation functions.
Nmeasure2 = 1000
C_worm = 2.0
p_insertworm = 1.0
p_moveworm = 0.4
p_insertkink = 0.3
p_deletekink = 0.2
p_glueworm = 0.1
outputfile = "Rb87_BKT_64_grand_canonical.out.h5"
checkpoint = "Rb87_BKT_64_grand_canonical.clone.h5"
